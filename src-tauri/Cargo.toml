[package]
name = "toutiao-sync-desktop"
version = "0.1.0"
description = "Toutiao favorites sync desktop app"
authors = ["OpenAI Codex"]
edition = "2021"

[lib]
name = "toutiao_sync_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
thiserror = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
webview2-com = "0.38"
